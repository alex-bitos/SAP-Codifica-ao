app = "sap-codigos-economico"
primary_region = "gru"

[build]
  dockerfile = "../Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  ALLOWED_ORIGINS = "https://sap-codigos-economico.fly.dev"
  SESSION_TTL_HOURS = "8"
  LOGIN_MAX_ATTEMPTS = "5"
  LOGIN_LOCK_MINUTES = "15"
  PG_POOL_MAX = "10"

[deploy]
  release_command = "node dist/cli/migrate.js"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
